[package]
name = "modern-chess-social"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto", "use_pem"] }
modern-chess-kernel = { path = "../kernel" }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "json", "chrono", "migrate"] }
thiserror = "1.0"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
modern-chess-testkeys = { path = "../testkeys" }
tower = { version = "0.5", features = ["util"] }
modern-chess-testdb = { path = "../testdb" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
