[package]
name = "modern-chess-social-api"
version = "0.1.0"
edition = "2021"

[dependencies]
modern-chess-social = { path = "../../crates/social" }
axum = "0.8"
dotenvy = "0.15"
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres"] }
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[dev-dependencies]
modern-chess-testdb = { path = "../../crates/testdb" }
modern-chess-testkeys = { path = "../../crates/testkeys" }
tower = { version = "0.5", features = ["util"] }
