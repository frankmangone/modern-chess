[package]
name = "modern-chess-game-api"
version = "0.1.0"
edition = "2021"

[dependencies]
modern-chess-game = { path = "../../crates/game" }
modern-chess-kernel = { path = "../../crates/kernel" }
modern-chess-engine = { path = "../../crates/engine" }
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "request-id"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "json", "migrate"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1.0"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
sha2 = "0.10"
hex = "0.4"
