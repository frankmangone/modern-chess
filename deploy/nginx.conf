# One address in front of everything, for `make share`. nginx listens on this machine only; the
# tunnel is what makes it reachable from outside. scripts/share.sh fills in __SHARE_PORT__ and
# runs it from the repo root, so `apps/web/dist` below is relative to the repo.
#
# This is also where rate limits live. The apps have none of their own: they trust whatever
# runs in front of them, and this is that.
daemon off;
worker_processes 1;
pid target/share/nginx.pid;
error_log target/share/nginx-error.log warn;

events {
	worker_connections 512;
}

http {
	access_log target/share/nginx-access.log;

	# Scratch space for large bodies, kept out of the system directories.
	client_body_temp_path target/share/nginx-tmp/body;
	proxy_temp_path target/share/nginx-tmp/proxy;
	fastcgi_temp_path target/share/nginx-tmp/fastcgi;
	uwsgi_temp_path target/share/nginx-tmp/uwsgi;
	scgi_temp_path target/share/nginx-tmp/scgi;

	# Listed here so the config does not depend on where nginx was installed. `wasm` matters:
	# the board engine is not instantiated by the browser with any other type.
	types {
		text/html html;
		text/css css;
		text/plain txt;
		application/javascript js mjs;
		application/json json;
		application/manifest+json webmanifest;
		application/wasm wasm;
		image/svg+xml svg;
		image/png png;
		image/jpeg jpg jpeg;
		image/webp webp;
		image/x-icon ico;
		font/woff2 woff2;
	}
	default_type application/octet-stream;

	gzip on;
	gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

	# The address of the person, not of the tunnel. cloudflared connects from this machine and
	# Cloudflare puts the real address in this header. It is believed only when the connection
	# really comes from here, and the server listens on this machine only, so nobody can make
	# up an address to dodge the limits.
	set_real_ip_from 127.0.0.1;
	real_ip_header CF-Connecting-IP;

	# Per address. Friends on one network share an allowance, so these are generous. The web
	# app asks for a match every 1.5 seconds per open page, which is well under the first one.
	limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
	# Makes a user: the calls an attacker would repeat to fill the database.
	limit_req_zone $binary_remote_addr zone=signup:10m rate=6r/m;
	limit_conn_zone $binary_remote_addr zone=perclient:10m;
	limit_req_status 429;
	limit_conn_status 429;

	server {
		listen 127.0.0.1:__SHARE_PORT__;
		# No host name on purpose: through the tunnel the Host header is the tunnel's address,
		# and a named server would not match it.
		server_name _;

		client_max_body_size 256k;
		limit_conn perclient 40;

		proxy_http_version 1.1;
		proxy_set_header Host $host;
		# Set, not appended to: a client cannot hand the apps an address of its choosing.
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Real-IP $remote_addr;

		error_page 429 = @too_many;
		location @too_many {
			default_type application/json;
			add_header Retry-After 10 always;
			return 429 '{"error":"too many requests"}';
		}

		# Guests and sign-in: a few at once, then one every ten seconds.
		location = /api/social/guests {
			limit_req zone=signup burst=10 nodelay;
			proxy_pass http://127.0.0.1:3002;
		}
		location = /api/social/session {
			limit_req zone=signup burst=10 nodelay;
			proxy_pass http://127.0.0.1:3002;
		}

		location /api/social/ {
			limit_req zone=api burst=60 nodelay;
			proxy_pass http://127.0.0.1:3002;
		}

		location /api/game/ {
			limit_req zone=api burst=60 nodelay;
			proxy_pass http://127.0.0.1:3001;
		}

		# Only the public covers folder of the image bucket. The MinIO console is never exposed.
		location /modern-chess/covers/ {
			limit_req zone=api burst=60 nodelay;
			proxy_pass http://127.0.0.1:9000;
		}

		# The built web app. Unknown paths fall back to index.html so the app's own routes work.
		location / {
			root apps/web/dist;
			try_files $uri /index.html;
		}
	}
}
