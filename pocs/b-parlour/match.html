<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chess match · B Parlour · BoardHub exploration</title>
  <link rel="stylesheet" href="theme.css" />
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-flag" viewBox="0 0 32 32"><path d="M7 29V5"/><path d="M7 7c5-3.5 9 3 14 0.5 2-1 3-1 4-.5v11c-1-.5-2-.5-4 .5-5 2.5-9-4-14-.5z" fill="#fffbf4"/></symbol>
  <symbol id="i-crown" viewBox="0 0 32 32"><path d="M4 25 3 10l7 6 6-9 6 9 7-6-1 15z" fill="#ffe9a6"/><path d="M5 28h22"/></symbol>
  <symbol id="i-door" viewBox="0 0 32 32"><path d="M8 28V6q0-2 2-2h12q2 0 2 2v22" fill="#fffbf4"/><path d="M4 28h24"/><circle cx="20" cy="17" r="1.6" fill="#8b4a2b"/></symbol>
  <symbol id="i-knight" viewBox="0 0 32 32"><path d="M9 28h15M11 28c0-6 2-8 3-11-3 1-5 3-7 4l-1-4 8-8c3-3 8-1 9 3 1 5 0 11 0 16z" fill="#fffbf4"/><circle cx="17" cy="11" r="1.2" fill="#8b4a2b"/></symbol>
  <symbol id="i-chat" viewBox="0 0 32 32"><path d="M5 8q0-2 2-2h18q2 0 2 2v12q0 2-2 2H14l-6 5v-5H7q-2 0-2-2z" fill="#fffbf4"/></symbol>
  <symbol id="i-folder" viewBox="0 0 32 32"><path d="M3 9q0-3 3-3h6l3 3h11q3 0 3 3v12q0 3-3 3H6q-3 0-3-3z" fill="#fffbf4"/></symbol>
  <symbol id="i-spark" viewBox="0 0 44 44"><path d="M22 3c1 10 4 17 19 19-15 2-18 9-19 19-1-10-4-17-19-19 15-2 18-9 19-19z"/></symbol>
</svg>

  <header class="top">
    <a class="mark" href="home.html"><svg class="i" style="width:36px;height:36px" aria-hidden="true"><use href="#i-knight"/></svg>BoardHub</a>
    <nav aria-label="Main"><a href="home.html">Games</a><a href="match.html" aria-current="page">Open match</a></nav>
  </header>

  <main class="desk">
    <p class="bubble" role="status" data-status>Your turn.</p>

    <section class="win board-win" aria-label="Chess match">
      <div class="win-bar">
        <svg class="i" aria-hidden="true"><use href="#i-knight"/></svg><span>Chess</span><span class="dots" aria-hidden="true"></span>
        <div data-resign="idle"><button class="btn small paper" type="button" data-action="resign"><svg class="i" aria-hidden="true"><use href="#i-flag"/></svg>Resign</button></div>
      </div>
      <div class="board-stage">
        <div class="who" data-bar="them"><span class="av" aria-hidden="true"></span>Guest-2103 <small>Black</small></div>
        <div class="handles"><i></i><i></i><i></i><i></i>
          <div class="board-frame">
            <div class="board" data-board></div>

            <div class="dialog" data-resign="ask" hidden>
              <div class="win pink" role="group" aria-labelledby="q">
                <div class="win-bar"><svg class="i" aria-hidden="true"><use href="#i-flag"/></svg><span class="dots" aria-hidden="true"></span></div>
                <div class="win-body">
                  <h2 id="q">Resign this match?</h2>
                  <div class="btns">
                    <button class="btn pink" type="button" data-action="confirm">Yes, resign</button>
                    <button class="btn" type="button" data-action="keep">Keep playing</button>
                  </div>
                </div>
              </div>
            </div>

            <div class="dialog" data-resign="none" hidden>
              <div class="win result sky">
                <div class="win-bar"><span>Match over</span><span class="dots" aria-hidden="true"></span></div>
                <div class="win-body">
                  <svg class="i crown" aria-hidden="true"><use href="#i-crown"/></svg>
                  <svg class="i flag" aria-hidden="true"><use href="#i-flag"/></svg>
                  <p data-status></p>
                  <a class="btn" href="home.html"><svg class="i" aria-hidden="true"><use href="#i-door"/></svg>Open a new lobby</a>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="who" data-bar="you"><span class="av" aria-hidden="true"></span>Guest-9331 (you) <small>White</small></div>
      </div>
    </section>

    <aside class="win pink captured" aria-label="Captured pieces">
      <div class="win-bar"><svg class="i" aria-hidden="true"><use href="#i-folder"/></svg><span>Captured</span><span class="dots" aria-hidden="true"></span></div>
      <div class="win-body">
        <div class="lost"><p>White lost</p><div class="pieces" data-captured="white"></div></div>
        <div class="lost"><p>Black lost</p><div class="pieces" data-captured="black"></div></div>
        <p class="balance">Material is even.</p>
      </div>
    </aside>

    <aside class="win sky chat" aria-label="Chat">
      <div class="win-bar"><svg class="i" aria-hidden="true"><use href="#i-chat"/></svg><span>Chat</span><span class="dots" aria-hidden="true"></span></div>
      <div class="win-body">Talking to your opponent during a match is not available yet.<div class="fake" aria-hidden="true">Say something…</div></div>
    </aside>
  </main>

  <script src="../shared/board.js"></script>
  <script>startMatch();</script>
</body>
</html>
