<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BoardHub: front page, quiet cards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&display=swap" />
  <link rel="stylesheet" href="../../apps/web/src/styles.css" />
  <link rel="stylesheet" href="../../apps/docs/theme/modern-chess-board.css" />
  <link rel="stylesheet" href="e.css" />
</head>
<body>
  <div class="page">
    <div id="nav"></div>
    <main>
      <section class="hero" aria-labelledby="hero-title" id="hero"></section>
      <section class="game-feed" id="games">
        <div class="q-section" id="popular-section">
          <div class="q-head">
            <h2 class="feed-title" id="popular-title">Popular right now</h2>
            <p class="q-note">Sample numbers, for this exploration only.</p>
          </div>
          <div class="q-popular" id="popular"></div>
        </div>
        <div class="q-section">
          <div class="q-head">
            <h2 class="feed-title" id="all-title">More to play</h2>
            <div class="q-filters" id="filters" role="group" aria-label="Filter by tag"></div>
          </div>
          <div class="q-grid" id="grid"></div>
          <p class="q-empty" id="empty" hidden>No game matches that tag.</p>
        </div>
      </section>
    </main>
    <div id="foot"></div>
  </div>
  <script type="module" src="../../apps/docs/theme/modern-chess-board.js"></script>
  <script type="module">
    import { load, shell, h, pictureBoard, heroBoard, tagsOf, fmt } from "./app.js";
    shell("games");
    const { games } = await load();
    const tops = games.filter((g) => !g.parent);
    const variantsOf = (g) => games.filter((x) => x.parent === g.slug);

    // ----- the original hero: headline, what to do, a decorative board -----
    document.getElementById("hero").append(
      h("h1", { id: "hero-title", class: "hero-title" }, "Every board game, in one place."),
      h("div", { class: "hero-aside" },
        h("p", { class: "hero-sub" }, "Pick a game, open a lobby, and play a friend. No sign-up: a guest name is made for you the first time you play."),
        h("p", { class: "hero-count" }, `${games.length} games available now`),
        h("div", { class: "hero-ctas" }, h("a", { class: "btn-primary-lg", href: "#games" }, "Browse the games"))),
      heroBoard());

    // ----- how a game gets featured: a pinned (featured) game leads, then the most played -----
    const ranked = [...tops].sort((a, b) => Number(b.featured) - Number(a.featured) || b.plays - a.plays);
    const band = ranked.slice(0, 3);

    const card = (g, { lead = false, side = false, plays = false } = {}) => {
      const variants = variantsOf(g);
      const pic = h("div", { class: "q-pic" });
      pictureBoard(pic, g);
      const other = tagsOf(g).filter((t) => t !== "classic" && t !== "modern" && t !== "historical");
      return h("article", { class: `q-card${lead ? " q-lead" : ""}${side ? " q-side" : ""}`, style: `--accent:${g.accent}`, "data-slug": g.slug },
        pic,
        h("h3", { class: "q-title" }, h("a", { href: `game.html?game=${g.slug}` }, g.name)),
        h("p", { class: "q-line" }, g.tagline),
        lead ? h("span", { class: "btn-primary-lg", "aria-hidden": "true" }, "Play now") : null,
        h("div", { class: "q-meta" },
          plays ? h("span", { class: "q-plays" }, `${fmt(g.plays)} played this week`) : h("span", {}, tagsOf(g)[0] ?? ""),
          variants.length ? h("a", { href: `game.html?game=${g.slug}#variants` }, `${variants.length} ${variants.length === 1 ? "variant" : "variants"} →`) : null));
    };

    document.getElementById("popular").append(
      card(band[0], { lead: true, plays: true }),
      h("div", { class: "q-stack" }, band.slice(1).map((g) => card(g, { side: true, plays: true }))));

    // ----- the rest, filtered by tag -----
    const tags = ["all", ...new Set(tops.flatMap(tagsOf))];
    let filter = "all";
    const filters = document.getElementById("filters");
    for (const t of tags) {
      filters.append(h("button", { class: "q-filter", "aria-pressed": String(t === "all"), onclick: (e) => {
        filter = t;
        filters.querySelectorAll(".q-filter").forEach((b) => b.setAttribute("aria-pressed", String(b === e.currentTarget)));
        render();
      } }, t === "all" ? "All" : t));
    }
    function render() {
      // With no filter the band already shows its three, so the grid shows the others.
      const shown = ranked.filter((g) => (filter === "all" ? !band.includes(g) : g.tags.includes(filter)));
      document.getElementById("popular-section").hidden = filter !== "all";
      document.getElementById("all-title").textContent = filter === "all" ? "More to play" : `${filter[0].toUpperCase()}${filter.slice(1)} games`;
      const grid = document.getElementById("grid");
      grid.replaceChildren(...shown.map((g) => card(g)));
      document.getElementById("empty").hidden = shown.length > 0;
    }
    render();
  </script>
</body>
</html>
